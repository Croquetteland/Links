<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Croquetteland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="icon" href="./favicon.png">
<style>
  :root{
    --ink: #2F4F3E;
    --coral: #FF8C69;
    --gold: #F4B942;
    --sage: #EAF4EE;
  }

  * { box-sizing: border-box; }

  html, body{
    height: 100%;
    margin:0;
  }

  body{
    font-family: 'Raleway', sans-serif;
    color: #fff;
    overflow: hidden;
  }

  /* ---- full-bleed background photo ---- */
  .bg{
    position: fixed;
    inset: 0;
    z-index: -2;
    /* Replace background.jpg with a real photo of the shop / animals */
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center;
    background-color: var(--ink);
  }

  .bg::before{
    /* fallback pattern shown if background.jpg is missing, using the brand palette */
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, var(--gold) 0%, transparent 40%),
      radial-gradient(circle at 85% 75%, var(--coral) 0%, transparent 45%),
      linear-gradient(160deg, var(--ink) 0%, #1c3329 100%);
    opacity: 0.9;
  }

  .overlay{
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.55) 0%,
      rgba(0,0,0,0.15) 30%,
      rgba(0,0,0,0.25) 70%,
      rgba(0,0,0,0.6) 100%
    );
  }

  .page{
    position: relative;
    height: 100vh;
    display:flex;
    flex-direction: column;
    align-items:center;
    padding: 6vh 8vw 4vh;
    text-align:center;
  }

  .logo-wrap{
    width: min(88px, 14vh);
    height: min(88px, 14vh);
    border-radius: 50%;
    background: var(--sage);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    border: 3px solid white;
    overflow:hidden;
    flex-shrink:0;
  }
  .logo-wrap img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  h1{
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 3.4vh, 26px);
    margin: 1.6vh 0 0.6vh;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }

  .tagline{
    font-size: clamp(12px, 1.7vh, 14px);
    font-weight: 600;
    opacity: 0.92;
    margin: 0 0 4vh;
    max-width: 260px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }

  .links{
    display:flex;
    flex-direction: column;
    gap: 1.4vh;
    width: 100%;
    max-width: 320px;
  }

  .link-btn{
    height: 60px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.95);
    color: var(--ink);
    border-radius: 999px;
    padding: 1.7vh 20px;
    text-decoration:none;
    font-family:'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(13px, 2vh, 15px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    border: 2px solid transparent;
    transition: border-color 0.15s ease;
  }

  .link-btn:hover{ border-color:#0f2b4a; }

  footer{
    margin-top: auto;
    padding-top: 3vh;
    font-size: clamp(10px, 1.3vh, 12px);
    opacity: 0.8;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }

</style>
</head>
<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="page">

  <div class="logo-wrap">
    <!-- Replace src with your real logo / profile photo -->
    <img src="./Logo.png" alt="Logo Croquetteland">
  </div>

  <h1>Croquetteland</h1>
  <p class="tagline">Votre animal mérite le meilleur</p>

  <div class="links">

    <a class="link-btn" href="https://maps.google.com/?q=Croquetteland" target="_blank" rel="noopener">
      Localisation du magasin
    </a>

    <a class="link-btn" href="https://g.page/r/CZQq3pSuxvvTEBE/review" target="_blank" rel="noopener">
      Laisser un avis Google
    </a>

    <a class="link-btn" href="https://www.facebook.com/profile.php?id=61591087658938" target="_blank" rel="noopener">
      Facebook
    </a>

    <a class="link-btn" href="https://www.instagram.com/animalerie_croquetteland/" target="_blank" rel="noopener">
      Instagram
    </a>

    <a class="link-btn" href="https://www.tiktok.com/@animalerie_croquetteland" target="_blank" rel="noopener">
      Tiktok
    </a>

  </div>

  <footer>© Croquetteland — Fait avec ❤️ pour vos compagnons</footer>

</div>

</body>
</html>
